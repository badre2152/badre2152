<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 310" width="1200" height="310" role="img" aria-labelledby="title description">
  <title id="title">Brahim Badre — Data Analyst and Data Engineer</title>
  <desc id="description">Professional profile banner in navy and teal, with a subtle bronze, silver and gold data pipeline motif.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="100%" stop-color="#15253A"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#BA8558"/>
      <stop offset="50%" stop-color="#A6B4C1"/>
      <stop offset="100%" stop-color="#E3BE64"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="310" rx="20" fill="url(#background)"/>
  <rect x="0" y="0" width="11" height="310" rx="5" fill="#2DD4C8"/>
  <circle cx="1045" cy="22" r="205" fill="#2DD4C8" opacity="0.035"/>
  <circle cx="1120" cy="310" r="195" fill="#2DD4C8" opacity="0.025"/>
  <text x="67" y="73" fill="#2DD4C8" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="3">DATA · INSIGHTS · ENGINEERING</text>
  <text x="64" y="149" fill="#F8FAFC" font-family="Arial, Helvetica, sans-serif" font-size="62" font-weight="700" letter-spacing="0.4">BRAHIM BADRE</text>
  <text x="67" y="202" fill="#DAE4EF" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="500">Data Analyst <tspan fill="#2DD4C8">/</tspan> Data Engineer</text>
  <rect x="67" y="230" width="615" height="1" fill="#31546B"/>
  <text x="67" y="261" fill="#91AFC1" font-family="Arial, Helvetica, sans-serif" font-size="18">Python  ·  SQL  ·  PostgreSQL  ·  Power BI</text>
  <path d="M810 166 H1120" fill="none" stroke="url(#flow)" stroke-width="5" stroke-linecap="round"/>
  <g stroke="#0B1220" stroke-width="5">
    <circle cx="836" cy="166" r="27" fill="#BA8558"/>
    <circle cx="966" cy="166" r="27" fill="#A6B4C1"/>
    <circle cx="1096" cy="166" r="27" fill="#E3BE64"/>
  </g>
  <g fill="#B6C9D8" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" letter-spacing="1">
